<!doctype html>
<html lang="en">
<head>
 <link rel="manifest" href="./manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Pasumai Kural</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700&family=Mukta+Malar:wght@400;600;700&display=swap">
<style>/* Streaming-style dark theme */
:root{--bg:#0f0f11;--card:#1b1b1f;--card2:#26262c;--ink:#f4f4f5;--mute:#a5a5ae;--line:#33333b;--accent:#e0252f;--accent2:#ff5a61;
 --haldi:#f2b50f;--soft:#26262c;--leaf:#5fcd7f;--sky:#2a1a2e;--field1:#3f7a2a;--field2:#2f5b22;--field3:#8cc63f;
 --body:"Mukta Malar",system-ui,"Noto Sans Tamil",sans-serif;--display:"Baloo Thambi 2","Mukta Malar",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;margin:0}
h2{font-size:1.25rem;margin:24px 0 8px} h3{font-size:1.08rem;margin:10px 0 4px} h4{margin:10px 0 0}
p{margin:6px 0} ul,ol{margin:6px 0;padding-left:1.25em} a{color:var(--accent2)}
.mute{color:var(--mute);font-size:.9rem}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
.topbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 4vw 8px;background:linear-gradient(#000d,#0000);transition:background .25s}
.topbar.solid{background:#0f0f11f5;border-bottom:1px solid var(--line)}
.brand{font:700 1.25rem var(--display);color:var(--accent);text-decoration:none;letter-spacing:.03em;white-space:nowrap;margin-right:auto}
.toplinks{display:none}
.back{background:none;border:0;color:var(--ink);font-size:2rem;line-height:1;cursor:pointer;min-width:40px;min-height:44px}
.lang{display:flex;border:1px solid #fff5;border-radius:8px;overflow:hidden;flex:none}
.lang button{background:#0008;color:var(--ink);border:0;padding:0 10px;min-height:38px;font:600 .9rem var(--body);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
.profile{width:38px;height:38px;flex:none;border-radius:6px;border:0;background:#2b7fa8;color:#fff;font:700 1.1rem var(--display);cursor:pointer}
main.page{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 4vw 24px}
.ptitle{font-size:1.7rem;margin-bottom:8px}
.narrow{max-width:560px}
.billboard{position:relative;min-height:min(84vh,620px);display:flex;align-items:flex-end;overflow:hidden}
.billboard .scene{position:absolute;inset:0} .billboard .scene svg{width:100%;height:100%;display:block}
.billboard::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000c,#0003 70%),linear-gradient(#0000 35%,var(--bg) 97%)}
.billboard .copy{position:relative;z-index:1;padding:90px 4vw 24px;max-width:640px;text-shadow:0 2px 8px #000}
.billboard h1{font-size:clamp(2.3rem,9vw,4.2rem);line-height:1.15}
.billboard h2{margin:6px 0;font-size:1.4rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.powered{font-size:.9rem;color:#ddd} .powered b,footer b{color:var(--haldi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:9px 20px;border-radius:6px;border:0;font:700 1rem var(--display);cursor:pointer;text-decoration:none;text-align:center;color:#fff}
.btn.primary{background:var(--accent)} .btn.primary:hover{background:#c41f28}
.btn.ghost{background:#6d6d7866;color:#fff} .btn.ghost:hover{background:#6d6d7899}
.btn.small{min-height:36px;padding:4px 12px;font-size:.9rem} .btn.wide{width:100%;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 150px;min-width:0}
.rail{padding:0 0 0 4vw} .rail h2{margin:18px 0 0}
.track{display:flex;gap:10px;overflow-x:auto;padding:12px 4vw 14px 2px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.track>*{scroll-snap-align:start;flex:none}
.poster{position:relative;width:138px;aspect-ratio:2/3;border:0;border-radius:6px;overflow:hidden;padding:0;cursor:pointer;color:#fff;font-family:var(--display);transition:transform .2s}
.poster:hover,.poster:focus-visible,.tile:hover{transform:scale(1.06);z-index:2}
.poster .pic{position:absolute;left:12%;top:12%;width:76%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#ffffff1f}
.pic svg{width:82%;height:82%;display:block} .pic.emoji{font-size:3.6rem;line-height:1}
.poster .num{position:absolute;top:5px;right:6px;font-size:.72rem;opacity:.85}
.poster .name{position:absolute;inset:auto 0 0;padding:26px 8px 8px;background:linear-gradient(#0000,#000e 60%);text-align:left;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.poster small{display:block;font:400 .75rem var(--body);color:#ccc}
.cat-field{background:linear-gradient(160deg,#8a6a10,#2c2206)} .cat-pulse{background:linear-gradient(160deg,#4d7a1f,#14240a)}
.cat-oil{background:linear-gradient(160deg,#a8560c,#2f1603)} .cat-veg{background:linear-gradient(160deg,#126b4a,#04241a)}
.cat-fruit{background:linear-gradient(160deg,#9c1f45,#2d0713)} .cat-other{background:linear-gradient(160deg,#4a2f8f,#150c2e)}
.tile{width:210px;min-height:140px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;padding:14px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(150deg,var(--card2),#141417);color:var(--ink);text-align:left;cursor:pointer;font:1rem/1.35 var(--body);transition:transform .2s}
.tile .ico{font-size:2rem} .tile small{color:var(--mute)} .tile.short{min-height:110px;width:170px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px} .grid .tile{width:auto}
.postergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px} .postergrid .poster{width:100%}
.postergrid .pic.emoji{font-size:2.6rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:0 14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0;min-width:0;overflow-wrap:anywhere}
main.home>.card{margin:20px 4vw}
.help .phone{font:700 1.5rem var(--display);user-select:all}
.crophero{display:flex;align-items:center;gap:18px;padding:24px 18px;border-radius:12px}
.crophero .pic{width:110px;height:110px;flex:none;display:grid;place-items:center;background:#ffffff1f;border-radius:50%}
.crophero h1{font-size:2rem}
.crophead{display:flex;gap:12px;align-items:center}.crophead>div:first-child{width:64px;flex:none;background:#ffffff14;border-radius:50%}.crophead svg{width:64px;height:64px;display:block}
.field{margin:12px 0}.field label,.legend,legend{display:block;font-weight:700;margin:0 0 4px;padding:0}
fieldset{border:0;padding:0;margin:14px 0}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:6px;border:1px solid #55555f;background:var(--card2);color:var(--ink);font:1rem var(--body)}
textarea{min-height:90px;resize:vertical}
[aria-invalid=true]{border-color:var(--accent2)} .err{color:var(--accent2);font-size:.9rem}
.search{max-width:420px;margin-top:8px}
.searchrow{display:flex;gap:10px;align-items:flex-start}.searchrow .field{flex:1;min-width:0}.searchrow .btn{margin-top:30px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.checks label{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.checks input{width:20px;min-height:20px;height:20px;accent-color:var(--accent)}
.fileb input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}.fileb:focus-within{outline:3px solid var(--haldi)}
.preview{max-width:100%;border-radius:8px;margin-top:10px}
.note{border-radius:8px;padding:11px 14px;margin:10px 0;background:var(--card2);border-left:4px solid #77778a}
.note.warn{background:#352b0d;border-color:var(--haldi);color:#ffe29a}.note.bad{background:#3d1215;border-color:var(--accent);color:#ffc2c4}
.tag{display:inline-block;padding:1px 10px;border-radius:4px;background:var(--card2);font-size:.85rem;font-weight:700}
.tag.good{background:#143d22;color:#8ee6a8}.tag.warn{background:#40330c;color:#ffd978}
.art{text-align:center;color:var(--mute);font-size:.8rem}.art svg{width:100%;max-width:260px;background:var(--soft);border-radius:8px}
dl{margin:0}dt{color:var(--mute);font-size:.85rem;margin-top:8px}dd{margin:0}
details{margin:10px 0}summary{cursor:pointer;font-weight:700;min-height:36px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}.nowrow{background:#4a1519}
.ref{display:inline-block;text-decoration:none}.ref b{color:var(--haldi)}.srcline{font-size:.9rem}
.tip{display:flex;gap:14px;align-items:center}.tip>b{font:700 2rem var(--display);color:var(--accent);min-width:28px}
.sources{list-style:none;padding:0}.sources li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.sources b{color:var(--haldi);min-width:42px}
.now{display:flex;gap:16px;align-items:center}.now .ico{font-size:3.2rem}.big{font:700 2.4rem var(--display)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}.stats div{background:var(--card2);border-radius:8px;padding:8px 10px}.stats b{display:block}.stats span{color:var(--mute);font-size:.85rem}
.day{display:grid;grid-template-columns:90px 30px 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.day small{grid-column:1/-1;color:var(--mute)}
.rain{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.rain i{display:block;height:100%;background:#4aa8d8}
footer{text-align:center;padding:28px 16px calc(90px + env(safe-area-inset-bottom,0px));color:var(--mute)}
.bottomnav{position:fixed;inset:auto 0 0;z-index:20;display:flex;background:#141416;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:6px 2px;text-decoration:none;color:var(--mute);font-size:.72rem;line-height:1.4;text-align:center}
.bottomnav a span{font-size:1.25rem}.bottomnav a[aria-current]{color:#fff;box-shadow:inset 0 3px var(--accent)}
.toast{position:fixed;left:16px;right:16px;bottom:90px;z-index:30;max-width:460px;margin:auto;background:#fff;color:#111;border-radius:8px;padding:12px 16px;font-weight:700;text-align:center}
@media (max-width:420px){.brand{font-size:1.05rem}.topbar{gap:8px}}
@media (min-width:900px){.toplinks{display:flex;gap:18px;margin-right:auto}.toplinks a{color:#ddd;text-decoration:none;font-size:.95rem}.toplinks a span{display:none}.toplinks a[aria-current]{color:#fff;font-weight:700}
 .brand{margin-right:12px}.bottomnav{display:none}footer{padding-bottom:28px}.poster{width:170px}.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

":"நோய் எதிர்ப்புத் திறன்","Pest Resistance":"பூச்சி எதிர்ப்புத் திறன்","Drought Tolerance":"வறட்சி தாங்கும் திறன்","Flood Tolerance":"வெள்ளம் தாங்கும் திறன்","Salinity Tolerance":"உவர் தாங்கும் திறன்","Kuruvai (Jun–Jul), Samba (Aug), Thaladi (Sep–Oct), Navarai (Dec–Jan)":"குறுவை (ஜூன்–ஜூலை), சம்பா (ஆகஸ்ட்), தாளடி (செப்–அக்), நவரை (டிச–ஜன)","About 1250 mm for a 110-day crop":"110 நாள் பயிருக்கு சுமார் 1250 மி.மீ","Choose a variety whose duration fits the season.":"பருவத்திற்கு ஏற்ற வயதுடைய இரகத்தைத் தேர்ந்தெடுக்கவும்.","Raise a healthy nursery and puddle and level the main field.":"ஆரோக்கியமான நாற்றங்கால் அமைத்து, நடவு வயலைச் சேறாக்கிச் சமன் செய்யவும்.","Transplant young seedlings and keep shallow water for the first week.":"இளம் நாற்றுகளை நட்டு, முதல் வாரம் குறைந்த ஆழத்தில் நீர் வைக்கவும்.","Apply fertilizer in splits and keep the field weed-free for the first 40 days.":"உரத்தைப் பிரித்து இடவும்; முதல் 40 நாட்கள் களையின்றி வைக்கவும்.","Drain the field before harvest and harvest when most grains turn golden.":"அறுவடைக்கு முன் நீரை வடிக்கவும்; பெரும்பாலான மணிகள் பொன்னிறமாகும்போது அறுவடை செய்யவும்.","Kharif, Rabi and irrigated summer":"காரீப், ரபி மற்றும் இறவைக் கோடைப் பருவம்","About 510 mm for a 105-day crop":"105 நாள் பயிருக்கு சுமார் 510 மி.மீ","Plough to a fine tilth.":"மண் நன்கு பொலபொலப்பாகும் வரை உழவும்.","Treat seed with Rhizobium and sow in lines.":"விதையை ரைசோபியத்துடன் நேர்த்தி செய்து வரிசையில் விதைக்கவும்.","Weed at about 20 and 45 days.":"சுமார் 20 மற்றும் 45 ஆம் நாட்களில் களை எடுக்கவும்.","Apply gypsum at 45 days and earth up.":"45 ஆம் நாளில் ஜிப்சம் இட்டு மண் அணைக்கவும்.","Harvest when the inner side of the pod shell turns dark.":"காய் ஓட்டின் உட்புறம் கருமையாகும்போது அறுவடை செய்யவும்.","Rainfed in Kharif; irrigated in Rabi or summer":"காரீப்பில் மானாவாரி; ரபி அல்லது கோடையில் இறவை","About 310 mm for a 95-day crop":"95 நாள் பயிருக்கு சுமார் 310 மி.மீ","Prepare a fine seedbed.":"நன்கு பண்பட்ட விதைப்படுக்கை தயார் செய்யவும்.","Sow in lines or transplant young seedlings.":"வரிசையில் விதைக்கவும் அல்லது இளம் நாற்றுகளை நடவும்.","Thin and weed within the first month.":"முதல் மாதத்திற்குள் பயிர் கலைத்துக் களை எடுக்கவும்.","Irrigate at flowering if water is available.":"நீர் இருந்தால் பூக்கும் பருவத்தில் பாசனம் செய்யவும்.","Harvest ears when they turn brown.":"கதிர்கள் பழுப்பு நிறமாகும்போது அறுவடை செய்யவும்.","Kharif and Rabi; irrigated summer":"காரீப் மற்றும் ரபி; இறவைக் கோடை","About 500 mm for a 105-day crop":"105 நாள் பயிருக்கு சுமார் 500 மி.மீ","Plough and form ridges or beds.":"உழுது பார்கள் அல்லது பாத்திகள் அமைக்கவும்.","Sow treated seed at the right spacing.":"நேர்த்தி செய்த விதையைச் சரியான இடைவெளியில் விதைக்கவும்.","Thin and weed early.":"ஆரம்பத்திலேயே பயிர் கலைத்துக் களை எடுக்கவும்.","Protect against shoot fly in the first month.":"முதல் மாதத்தில் குருத்து ஈயிலிருந்து பாதுகாக்கவும்.","Harvest when grains are hard.":"மணிகள் கடினமானதும் அறுவடை செய்யவும்.","Kharif, Rabi, summer and rice fallows":"காரீப், ரபி, கோடை மற்றும் நெல் தரிசு","About 280 mm for a 65-day crop":"65 நாள் பயிருக்கு சுமார் 280 மி.மீ","Treat seed with Rhizobium.":"விதையை ரைசோபியத்துடன் நேர்த்தி செய்யவும்.","Sow in lines on a well-drained field.":"நல்ல வடிகால் உள்ள வயலில் வரிசையில் விதைக்கவும்.","Weed once at about 20 days.":"சுமார் 20 ஆம் நாளில் ஒரு முறை களை எடுக்கவும்.","Avoid water stagnation.":"நீர் தேங்குவதைத் தவிர்க்கவும்.","Harvest when most pods turn black.":"பெரும்பாலான காய்கள் கருமையானதும் அறுவடை செய்யவும்.","Jun–Jul, Sep–Oct and Jan–Feb":"ஜூன்–ஜூலை, செப்–அக் மற்றும் ஜன–பிப்","About 500 mm for a 100-day crop":"100 நாள் பயிருக்கு சுமார் 500 மி.மீ","Apply farmyard manure at ploughing.":"உழவின்போது தொழு உரம் இடவும்.","Sow on ridges at recommended spacing.":"பரிந்துரைத்த இடைவெளியில் பார்களில் விதைக்கவும்.","Check whorls often for fall armyworm.":"படைப்புழுவுக்காகக் குருத்துகளை அடிக்கடி பார்க்கவும்.","Do not let the crop dry at tasseling and silking.":"பூங்கதிர் மற்றும் நூலிழை வரும் பருவத்தில் பயிர் காய விடாதீர்கள்.","Harvest when the cob sheath turns dry and brown.":"கதிரின் மேலுறை காய்ந்து பழுப்பானதும் அறுவடை செய்யவும்.","Winter irrigated (Aug–Sep), summer irrigated (Feb–Mar), rainfed with monsoon":"குளிர்கால இறவை (ஆக–செப்), கோடை இறவை (பிப்–மார்), பருவமழையுடன் மானாவாரி","About 600 mm for a 165-day crop":"165 நாள் பயிருக்கு சுமார் 600 மி.மீ","Make ridges and furrows.":"பார்களும் சால்களும் அமைக்கவும்.","Sow treated seed and fill gaps early.":"நேர்த்தி செய்த விதையை விதைத்து, இடைவெளிகளை விரைவில் நிரப்பவும்.","Keep weed-free for the first two months.":"முதல் இரண்டு மாதங்கள் களையின்றி வைக்கவும்.","Watch for sucking pests and bollworms.":"சாறு உறிஞ்சும் பூச்சிகள் மற்றும் காய்ப்புழுக்களைக் கவனிக்கவும்.","Pick fully opened bolls in dry weather.":"நன்கு வெடித்த காய்களை வறண்ட வானிலையில் பறிக்கவும்.","Jan–Feb, Jun–Jul and Sep–Oct":"ஜன–பிப், ஜூன்–ஜூலை மற்றும் செப்–அக்","Irrigate weekly after establishment":"நாற்று வேர் பிடித்த பின் வாரந்தோறும் பாசனம்","Raise seedlings in a protected nursery.":"பாதுகாக்கப்பட்ட நாற்றங்காலில் நாற்று வளர்க்கவும்.","Apply farmyard manure and transplant on ridges.":"தொழு உரம் இட்டு பார்களில் நடவு செய்யவும்.","Irrigate weekly and drain extra water.":"வாரந்தோறும் பாசனம் செய்து, அதிக நீரை வடிக்கவும்.","Remove virus-affected plants early.":"நச்சுயிர் தாக்கிய செடிகளை ஆரம்பத்திலேயே அகற்றவும்.","Pick green or ripe fruits as the market needs.":"சந்தைத் தேவைக்கேற்ப பச்சை அல்லது பழுத்த காய்களைப் பறிக்கவும்.","Jun–Jul, Nov–Dec and Feb–Mar":"ஜூன்–ஜூலை, நவ–டிச மற்றும் பிப்–மார்","About 600–800 mm":"சுமார் 600–800 மி.மீ","Raise seedlings under net.":"வலையின் கீழ் நாற்று வளர்க்கவும்.","Transplant at about 25 days on ridges.":"சுமார் 25 ஆம் நாளில் பார்களில் நடவு செய்யவும்.","Stake tall plants.":"உயரமான செடிகளுக்கு ஊன்றுகோல் கொடுக்கவும்.","Irrigate evenly to prevent fruit cracking.":"பழ வெடிப்பைத் தடுக்கச் சீராகப் பாசனம் செய்யவும்.","Pick fruits at the stage your market prefers.":"சந்தை விரும்பும் பருவத்தில் பழங்களைப் பறிக்கவும்.","Main planting December–May":"முதன்மை நடவு டிசம்பர்–மே","About 2200 mm for a 360-day crop":"360 நாள் பயிருக்கு சுமார் 2200 மி.மீ","Choose healthy, disease-free setts.":"ஆரோக்கியமான, நோயற்ற விதைக் கரணைகளைத் தேர்ந்தெடுக்கவும்.","Plant in furrows with good drainage.":"நல்ல வடிகால் உள்ள சால்களில் நடவும்.","Earth up and remove dry leaves.":"மண் அணைத்து, காய்ந்த சோகைகளை அகற்றவும்.","Never let the crop dry in the first 120 days.":"முதல் 120 நாட்களில் பயிர் காயவே கூடாது.","Harvest at maturity and crush quickly.":"முதிர்ந்ததும் அறுவடை செய்து விரைவில் அரைக்கவும்.","Depends on variety; common windows are Jan–May and Nov–Dec":"இரகத்தைப் பொறுத்தது; பொதுவாக ஜன–மே மற்றும் நவ–டிச","About 1800 mm with surface irrigation":"பரப்புப் பாசனத்தில் சுமார் 1800 மி.மீ","Plant healthy suckers or tissue-culture plants.":"ஆரோக்கியமான கன்றுகள் அல்லது திசு வளர்ப்புச் செடிகளை நடவும்.","Irrigate after planting, again after 4 days, then weekly.":"நட்டவுடன், 4 நாட்கள் கழித்து, பின் வாரந்தோறும் பாசனம் செய்யவும்.","Remove extra side suckers.":"கூடுதல் பக்கக் கன்றுகளை அகற்றவும்.","Prop plants carrying bunches.":"குலை தள்ளிய மரங்களுக்கு முட்டுக் கொடுக்கவும்.","Harvest bunches 100–150 days after flowering.":"பூத்த 100–150 நாட்களில் குலைகளை அறுவடை செய்யவும்.","Yellow leaves":"மஞ்சள் நிற இலைகள்","Spots on leaves":"இலைகளில் புள்ளிகள்","Leaf curling":"இலை சுருளுதல்","Holes or chewed parts":"துளைகள் அல்லது கடிக்கப்பட்ட பாகங்கள்","Drying or wilting plants":"செடி காய்தல் அல்லது வாடுதல்","Rotting stem or fruit":"தண்டு அல்லது காய் அழுகல்","White powder or rusty pustules":"வெள்ளைப் பொடி அல்லது துருக் கொப்புளங்கள்","Insects seen on plant":"செடியில் பூச்சிகள் தென்படுதல்","Poor or stunted growth":"குன்றிய வளர்ச்சி",Blast:"குலை நோய்",Disease:"நோய்","Spindle-shaped spots on leaves with grey centres and brown edges":"இலைகளில் சாம்பல் நிற மையமும் பழுப்பு ஓரமும் கொண்ட கண் வடிவப் புள்ளிகள்","Neck of the panicle may turn black and break":"கதிரின் கழுத்து கருகி ஒடியலாம்","A fungus. Favoured by cool nights, dew, cloudy weather and too much nitrogen.":"பூஞ்சை நோய். குளிர்ந்த இரவு, பனி, மேகமூட்டம், அதிக தழைச்சத்து ஆகியவை சாதகம்.","Grow a resistant variety":"எதிர்ப்புத் திறன் கொண்ட இரகத்தைப் பயிரிடவும்","Keep proper spacing":"சரியான இடைவெளி விடவும்","Apply nitrogen in splits and only as recommended":"தழைச்சத்தைப் பிரித்து, பரிந்துரைத்த அளவு மட்டும் இடவும்","Clear grass weeds from bunds":"வரப்புகளில் உள்ள புல் களைகளை அகற்றவும்","Stop extra nitrogen for now":"கூடுதல் தழைச்சத்து இடுவதை இப்போது நிறுத்தவும்","Ask your agriculture officer for the approved fungicide and dose":"அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லி மற்றும் அளவை வேளாண் அலுவலரிடம் கேட்கவும்","Bacterial leaf blight":"பாக்டீரியா இலைக் கருகல்","Yellow to straw-coloured stripes starting at leaf tips and edges, with wavy margins":"இலை நுனி மற்றும் ஓரங்களில் தொடங்கும் அலை அலையான மஞ்சள் அல்லது வைக்கோல் நிறக் கோடுகள்","Leaves dry from the tip downwards":"இலைகள் நுனியிலிருந்து கீழ்நோக்கிக் காயும்","Bacteria spread by water, wind-driven rain and injured leaves.":"நீர், காற்றுடன் வரும் மழை, காயமடைந்த இலைகள் மூலம் பாக்டீரியா பரவும்.","Use resistant or tolerant varieties":"எதிர்ப்பு அல்லது தாங்கும் இரகங்களைப் பயன்படுத்தவும்","Avoid excess nitrogen":"அதிக தழைச்சத்தைத் தவிர்க்கவும்","Do not let water flow from an affected field to a healthy one":"நோய் தாக்கிய வயலிலிருந்து நல்ல வயலுக்கு நீர் செல்ல விடாதீர்கள்","Drain the field for a few days where possible":"முடிந்தால் சில நாட்கள் வயல் நீரை வடிக்கவும்","Get advice from the agriculture officer before spraying":"தெளிப்பதற்கு முன் வேளாண் அலுவலரிடம் ஆலோசனை பெறவும்","Brown planthopper":"புகையான் (பழுப்புத் தத்துப்பூச்சி)",Pest:"பூச்சி","Small brown insects crowded at the base of plants":"செடியின் அடிப்பகுதியில் சிறிய பழுப்புப் பூச்சிகள் கூட்டமாக இருக்கும்","Plants turn yellow, then dry in round patches (hopper burn)":"செடிகள் மஞ்சளாகி, வட்ட வடிவத் திட்டுகளாகக் காயும் (புகைந்தது போல்)","A sap-sucking insect. Builds up with dense planting, standing water and heavy nitrogen.":"சாறு உறிஞ்சும் பூச்சி. நெருக்கமான நடவு, தேங்கிய நீர், அதிக தழைச்சத்தால் பெருகும்.","Leave alleys between planting strips":"நடவுப் பட்டைகளுக்கு இடையே பாதை விடவும்","Use alternate wetting and drying":"நீர் மறைய மறையப் பாசனம் செய்யவும்","Protect spiders and other natural enemies":"சிலந்திகள் மற்றும் பிற நன்மை செய்யும் உயிரினங்களைக் காக்கவும்","Drain water for 3–4 days":"3–4 நாட்களுக்கு நீரை வடிக்கவும்","Part the plants and check the base often":"செடிகளை விலக்கி அடிப்பகுதியை அடிக்கடி பார்க்கவும்","Spray only on an officer's advice, aimed at the base":"அலுவலர் ஆலோசனைப்படி மட்டும், செடியின் அடியில் படும்படி தெளிக்கவும்","Stem borer":"தண்டுத் துளைப்பான்","Central shoot dries in young plants (dead heart)":"இளம் பயிரில் நடுக்குருத்து காய்தல் (குருத்துக் காய்வு)","Empty white panicles at flowering (white ear)":"பூக்கும் பருவத்தில் மணியற்ற வெண்கதிர்கள்","Caterpillars boring inside the stem.":"தண்டினுள் துளைத்துச் செல்லும் புழுக்கள்.","Clip seedling tips with egg masses before transplanting":"நடவுக்கு முன் முட்டைக் குவியல் உள்ள நாற்று நுனிகளைக் கிள்ளவும்","Use light or pheromone traps":"விளக்குப் பொறி அல்லது இனக்கவர்ச்சிப் பொறி வைக்கவும்","Plough in stubble after harvest":"அறுவடைக்குப் பின் தாள்களை மடக்கி உழவும்","Release Trichogramma egg parasitoids where available":"கிடைக்கும் இடங்களில் டிரைகோகிரம்மா முட்டை ஒட்டுண்ணிகளை விடவும்","Use approved insecticide only if damage crosses the advised level":"சேதம் பரிந்துரைத்த அளவைத் தாண்டினால் மட்டும் அங்கீகரிக்கப்பட்ட பூச்சிக்கொல்லி பயன்படுத்தவும்","Early blight":"முன்பருவ இலைக் கருகல்","Brown spots with ring-like circles on older leaves":"பழைய இலைகளில் வளையம் போன்ற வட்டங்களுடன் பழுப்புப் புள்ளிகள்","Yellowing around spots; leaves dry and fall":"புள்ளிகளைச் சுற்றி மஞ்சளாகி, இலைகள் காய்ந்து உதிரும்","A fungus that survives on crop debris and spreads in warm, wet weather.":"பயிர்க் கழிவுகளில் தங்கி, வெப்பமான ஈர வானிலையில் பரவும் பூஞ்சை.","Avoid wetting the leaves":"இலைகள் நனைவதைத் தவிர்க்கவும்","Remove infected plant material":"நோய் தாக்கிய செடிப் பாகங்களை அகற்றவும்","Rotate with a different crop family":"வேறு குடும்பப் பயிருடன் பயிர் சுழற்சி செய்யவும்","Remove badly affected leaves":"அதிகம் பாதித்த இலைகளை அகற்றவும்","Ask your officer for the approved fungicide":"அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லியை அலுவலரிடம் கேட்கவும்","Leaf curl virus":"இலைச் சுருள் நச்சுயிரி நோய்","Leaves curl upward and become small and thick":"இலைகள் மேல்நோக்கிச் சுருண்டு, சிறுத்துத் தடிக்கும்","Plants stay short with few fruits":"செடிகள் குட்டையாகி, காய்கள் குறையும்","A virus carried by whiteflies.":"வெள்ளை ஈக்கள் பரப்பும் நச்சுயிரி.","Grow resistant hybrids":"எதிர்ப்புத் திறன் கொண்ட வீரிய ஒட்டு இரகங்களைப் பயிரிடவும்","Raise seedlings under insect net":"பூச்சி வலையின் கீழ் நாற்று வளர்க்கவும்","Use yellow sticky traps":"மஞ்சள் ஒட்டும் பொறிகளைப் பயன்படுத்தவும்","Grow maize or sorghum as a border":"மக்காச்சோளம் அல்லது சோளத்தை வரப்புப் பயிராக வளர்க்கவும்","Pull out and destroy affected plants early":"பாதித்த செடிகளை ஆரம்பத்திலேயே பிடுங்கி அழிக்கவும்","Control whiteflies as advised; the virus itself has no cure":"ஆலோசனைப்படி வெள்ளை ஈயைக் கட்டுப்படுத்தவும்; நச்சுயிரிக்கு மருந்து இல்லை","Fruit borer":"காய்ப்புழு","Round holes in fruits with a caterpillar feeding inside":"காய்களில் வட்டத் துளைகள், உள்ளே புழு உண்டுகொண்டிருக்கும்","Damaged fruits rot":"சேதமான காய்கள் அழுகும்","Caterpillars of a moth.":"அந்துப்பூச்சியின் புழுக்கள்.","Plant marigold as a trap crop":"செண்டுமல்லியைப் பொறிப் பயிராக நடவும்","Set pheromone traps":"இனக்கவர்ச்சிப் பொறிகள் வைக்கவும்","Collect and destroy damaged fruits and larvae":"சேதமான காய்களையும் புழுக்களையும் சேகரித்து அழிக்கவும்","Use approved biological or chemical sprays on advice":"ஆலோசனைப்படி அங்கீகரிக்கப்பட்ட உயிரியல் அல்லது இரசாயன மருந்து தெளிக்கவும்","Bacterial wilt":"பாக்டீரியா வாடல்","Whole plant wilts suddenly while leaves are still green":"இலைகள் பச்சையாக இருக்கும்போதே செடி முழுவதும் திடீரென வாடும்","Cut stem gives a milky ooze in water":"வெட்டிய தண்டை நீரில் வைத்தால் பால் போன்ற திரவம் வரும்","Soil-borne bacteria.":"மண் வழிப் பரவும் பாக்டீரியா.","Use resistant varieties":"எதிர்ப்பு இரகங்களைப் பயன்படுத்தவும்","Rotate with cereals":"தானியப் பயிர்களுடன் பயிர் சுழற்சி செய்யவும்","Keep drainage good":"நல்ல வடிகால் வைத்திருக்கவும்","Remove affected plants with soil around roots":"பாதித்த செடிகளை வேரைச் சுற்றிய மண்ணுடன் அகற்றவும்","There is no reliable spray cure; consult your officer":"நம்பகமான தெளிப்பு மருந்து இல்லை; அலுவலரிடம் ஆலோசிக்கவும்","Leafhopper (jassid)":"தத்துப்பூச்சி (ஜாசிட்)","Leaf edges turn yellow then red-brown":"இலை ஓரங்கள் மஞ்சளாகி பின் செம்பழுப்பாகும்","Leaves curl downward":"இலைகள் கீழ்நோக்கிச் சுருளும்","Small green insects move sideways under leaves":"இலைகளின் அடியில் சிறிய பச்சைப் பூச்சிகள் பக்கவாட்டில் நகரும்","Sap-sucking insects.":"சாறு உறிஞ்சும் பூச்சிகள்.","Use tolerant varieties":"தாங்கும் திறன் கொண்ட இரகங்களைப் பயன்படுத்தவும்","Protect natural enemies":"நன்மை செய்யும் உயிரினங்களைக் காக்கவும்","Check the underside of leaves weekly":"வாரந்தோறும் இலையின் அடிப்பகுதியைப் பார்க்கவும்","Spray only when the advised level is crossed":"பரிந்துரைத்த அளவைத் தாண்டினால் மட்டும் தெளிக்கவும்",Bollworm:"காய்ப்புழு (பருத்தி)","Holes in buds and bolls":"மொட்டுகள் மற்றும் காய்களில் துளைகள்","Flowers fail to open properly; lint is stained":"பூக்கள் சரியாக விரியாது; பஞ்சு கறைபடும்","Caterpillars including pink bollworm.":"இளஞ்சிவப்புக் காய்ப்புழு உள்ளிட்ட புழுக்கள்.","Sow on time with neighbours":"அண்டை விவசாயிகளுடன் ஒரே சமயத்தில் பருவத்தில் விதைக்கவும்","Remove crop residue after the last picking":"கடைசிப் பறிப்புக்குப் பின் பயிர்க் கழிவுகளை அகற்றவும்","Destroy damaged buds and bolls":"சேதமான மொட்டுகளையும் காய்களையும் அழிக்கவும்","Follow the approved spray advice":"அங்கீகரிக்கப்பட்ட தெளிப்பு ஆலோசனையைப் பின்பற்றவும்","Bacterial blight":"பாக்டீரியா கருகல்","Angular water-soaked spots bounded by veins":"நரம்புகளால் வரையறுக்கப்பட்ட கோண வடிவ நீர்க்கசிவுப் புள்ளிகள்","Black streaks on stems and spots on bolls":"தண்டுகளில் கருங்கோடுகள், காய்களில் புள்ளிகள்","Seed-borne and rain-splashed bacteria.":"விதை மற்றும் மழைத்துளி மூலம் பரவும் பாக்டீரியா.","Use clean treated seed":"சுத்தமான நேர்த்தி செய்த விதையைப் பயன்படுத்தவும்","Remove old crop debris":"பழைய பயிர்க் கழிவுகளை அகற்றவும்","Rotate crops":"பயிர் சுழற்சி செய்யவும்","Remove badly affected plants":"அதிகம் பாதித்த செடிகளை அகற்றவும்","Ask the officer for the approved spray":"அங்கீகரிக்கப்பட்ட தெளிப்பு மருந்தை அலுவலரிடம் கேட்கவும்","Leaf spot (tikka)":"இலைப்புள்ளி நோய் (டிக்கா)","Dark round spots on leaves, often with a yellow ring":"இலைகளில் கருமையான வட்டப் புள்ளிகள், பெரும்பாலும் மஞ்சள் வளையத்துடன்","Early leaf fall":"இலைகள் முன்கூட்டியே உதிர்தல்","Fungi surviving on crop debris.":"பயிர்க் கழிவுகளில் தங்கும் பூஞ்சைகள்.","Destroy debris and volunteer plants":"பயிர்க் கழிவுகளையும் தானாக முளைத்த செடிகளையும் அழிக்கவும்","Grow tolerant varieties":"தாங்கும் இரகங்களைப் பயிரிடவும்","Ask your officer for the approved fungicide at first signs":"முதல் அறிகுறியிலேயே அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லியை அலுவலரிடம் கேட்கவும்",Rust:"துரு நோய்","Small orange-brown pustules under the leaves":"இலைகளின் அடியில் சிறிய ஆரஞ்சு-பழுப்புக் கொப்புளங்கள்","Leaves dry but stay attached":"இலைகள் காய்ந்தாலும் செடியிலேயே ஒட்டியிருக்கும்","A fungus spread by wind.":"காற்றில் பரவும் பூஞ்சை.","Sow on time":"பருவத்தில் விதைக்கவும்","Remove volunteer plants":"தானாக முளைத்த செடிகளை அகற்றவும்","Get an approved fungicide recommendation early":"அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லிப் பரிந்துரையை விரைவில் பெறவும்","Leaf miner":"இலைச் சுரங்கப் புழு","Brown blotches where larvae feed inside leaves":"இலையினுள் புழு உண்ணும் இடங்களில் பழுப்புத் திட்டுகள்","Folded or webbed leaflets":"மடிந்த அல்லது பின்னப்பட்ட சிற்றிலைகள்","Small caterpillars mining leaves.":"இலையைக் குடையும் சிறு புழுக்கள்.","Grow cowpea or soybean as a trap crop":"தட்டைப்பயறு அல்லது சோயாவைப் பொறிப் பயிராக வளர்க்கவும்","Use light traps":"விளக்குப் பொறிகளைப் பயன்படுத்தவும்","Hand-pick folded leaflets in small plots":"சிறு நிலங்களில் மடிந்த இலைகளைக் கையால் பறித்து அழிக்கவும்","Spray only on advice":"ஆலோசனைப்படி மட்டும் தெளிக்கவும்","Sigatoka leaf spot":"சிகடோகா இலைப்புள்ளி நோய்","Narrow yellow or brown streaks that grow into spots with grey centres":"குறுகிய மஞ்சள் அல்லது பழுப்புக் கீற்றுகள் சாம்பல் மையப் புள்ளிகளாக வளரும்","Leaves dry early":"இலைகள் முன்கூட்டியே காயும்","A fungus favoured by humid weather.":"ஈரப்பத வானிலையில் பெருகும் பூஞ்சை.","Give wider spacing":"அதிக இடைவெளி விடவும்","Drain well":"நன்கு வடிகால் அமைக்கவும்","Remove dried leaves":"காய்ந்த இலைகளை அகற்றவும்","Cut and destroy affected leaf parts":"பாதித்த இலைப் பகுதிகளை வெட்டி அழிக்கவும்","Ask for the approved fungicide spray":"அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லித் தெளிப்பைக் கேட்டறியவும்","Fusarium wilt (Panama disease)":"ஃபியூசேரியம் வாடல் (பனாமா நோய்)","Older leaves turn yellow and hang down":"பழைய இலைகள் மஞ்சளாகித் தொங்கும்","Brown discolouration inside the stem":"தண்டினுள் பழுப்பு நிற மாற்றம்","A soil fungus that persists for many years.":"பல ஆண்டுகள் மண்ணில் தங்கும் பூஞ்சை.","Plant resistant varieties":"எதிர்ப்பு இரகங்களை நடவும்","Use disease-free planting material":"நோயற்ற நடவுப் பொருளைப் பயன்படுத்தவும்","Do not move soil or suckers from affected fields":"பாதித்த வயலிலிருந்து மண் அல்லது கன்றுகளை எடுத்துச் செல்லாதீர்கள்","Uproot and destroy affected plants":"பாதித்த மரங்களை வேருடன் பிடுங்கி அழிக்கவும்","Report to your agriculture officer; there is no reliable cure":"வேளாண் அலுவலரிடம் தெரிவிக்கவும்; நம்பகமான மருந்து இல்லை","Pseudostem weevil":"தண்டுக் கூன்வண்டு","Small holes with jelly-like ooze on the stem":"தண்டில் பசை போன்ற திரவம் வடியும் சிறு துளைகள்","Plants weaken and break":"மரங்கள் பலவீனமாகி ஒடியும்","A beetle whose grubs tunnel in the stem.":"தண்டினுள் குடையும் புழுக்களைக் கொண்ட வண்டு.","Keep the garden clean":"தோட்டத்தைச் சுத்தமாக வைக்கவும்","Remove old leaf sheaths":"பழைய இலை உறைகளை அகற்றவும்","Use traps made of cut stem pieces":"வெட்டிய தண்டுத் துண்டுப் பொறிகளைப் பயன்படுத்தவும்","Destroy badly infested plants":"அதிகம் பாதித்த மரங்களை அழிக்கவும்","Follow the approved stem treatment":"அங்கீகரிக்கப்பட்ட தண்டு சிகிச்சை முறையைப் பின்பற்றவும்","Leaf curl complex":"இலைச் சுருள் நோய்த் தொகுதி","Leaves curl and crinkle":"இலைகள் சுருண்டு சுருங்கும்","Plants stay bushy and small":"செடிகள் புதர் போலவும் சிறியதாகவும் இருக்கும்","Viruses carried by whiteflies; thrips and mites also curl leaves.":"வெள்ளை ஈ பரப்பும் நச்சுயிரிகள்; இலைப்பேன் மற்றும் சிலந்திப் பேனும் இலைகளைச் சுருட்டும்.","Protect the nursery with net":"வலை அமைத்து நாற்றங்காலைப் பாதுகாக்கவும்","Use sticky traps":"ஒட்டும் பொறிகளைப் பயன்படுத்தவும்","Remove virus-affected plants":"நச்சுயிரி தாக்கிய செடிகளை அகற்றவும்","Identify the insect or mite with your officer before spraying":"தெளிப்பதற்கு முன் பூச்சி அல்லது பேனை அலுவலருடன் அடையாளம் காணவும்","Anthracnose (fruit rot)":"பழ அழுகல் (ஆந்த்ராக்னோஸ்)","Sunken dark spots with rings on ripe fruits":"பழுத்த காய்களில் வளையங்களுடன் குழிந்த கரும்புள்ளிகள்","Twigs dry from the tip (dieback)":"கிளைகள் நுனியிலிருந்து காயும் (நுனிக் கருகல்)","A seed-borne fungus spread in humid weather.":"ஈரப்பத வானிலையில் பரவும், விதை வழிப் பூஞ்சை.","Use treated seed":"நேர்த்தி செய்த விதையைப் பயன்படுத்தவும்","Remove infected fruits and twigs":"பாதித்த காய்களையும் கிளைகளையும் அகற்றவும்","Ask for the approved fungicide":"அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லியைக் கேட்டறியவும்","Dry harvested fruits on a clean surface":"அறுவடை செய்த காய்களைச் சுத்தமான தளத்தில் உலர்த்தவும்","Powdery mildew":"சாம்பல் நோய்","White powder under leaves with yellow patches above":"இலையின் அடியில் வெள்ளைப் பொடி, மேலே மஞ்சள் திட்டுகள்","Leaves drop":"இலைகள் உதிரும்","A fungus favoured by dry days and humid nights.":"வறண்ட பகலும் ஈரமான இரவும் சாதகமான பூஞ்சை.","Avoid crowding":"நெருக்கமாக நடுவதைத் தவிர்க்கவும்","Get an approved sulphur or fungicide recommendation":"அங்கீகரிக்கப்பட்ட கந்தகம் அல்லது பூஞ்சைக்கொல்லிப் பரிந்துரையைப் பெறவும்","Fall armyworm":"அமெரிக்கப் படைப்புழு","Ragged holes and windows in leaves":"இலைகளில் ஒழுங்கற்ற துளைகள் மற்றும் சன்னல் போன்ற பகுதிகள்","Sawdust-like droppings in the whorl":"குருத்தில் மரத்தூள் போன்ற கழிவுகள்","A moth caterpillar that feeds in the whorl.":"குருத்தில் உண்ணும் அந்துப்பூச்சிப் புழு.","Plough deeply before sowing":"விதைப்புக்கு முன் ஆழமாக உழவும்","Grow a cowpea or sorghum border":"தட்டைப்பயறு அல்லது சோளத்தை வரப்புப் பயிராக வளர்க்கவும்","Crush egg masses and young larvae":"முட்டைக் குவியல்களையும் இளம் புழுக்களையும் நசுக்கவும்","Apply the approved treatment into the whorl on advice":"ஆலோசனைப்படி அங்கீகரிக்கப்பட்ட மருந்தைக் குருத்தில் இடவும்","Turcicum leaf blight":"டர்சிகம் இலைக் கருகல்","Long cigar-shaped grey-brown lesions on leaves":"இலைகளில் நீண்ட சுருட்டு வடிவ சாம்பல்-பழுப்புப் புண்கள்","Leaves look scorched":"இலைகள் தீய்ந்தது போல் தோன்றும்","A fungus surviving on residue.":"பயிர்க் கழிவுகளில் தங்கும் பூஞ்சை.","Grow tolerant hybrids":"தாங்கும் வீரிய ஒட்டு இரகங்களைப் பயிரிடவும்","Remove residue":"பயிர்க் கழிவுகளை அகற்றவும்","Ask for the approved fungicide if it spreads early":"ஆரம்பத்திலேயே பரவினால் அங்கீகரிக்கப்பட்ட பூஞ்சைக்கொல்லியைக் கேட்டறியவும்","Rows of small holes in leaves":"இலைகளில் வரிசையான சிறு துளைகள்","Central shoot dries (dead heart)":"நடுக்குருத்து காய்தல் (குருத்துக் காய்வு)","Caterpillars tunnelling in the stem.":"தண்டினுள் குடையும் புழுக்கள்.","Destroy stubble":"தாள்களை அழிக்கவும்","Intercrop with pulses":"பயறு வகைகளை ஊடுபயிராக வளர்க்கவும்","Remove dead hearts":"காய்ந்த குருத்துகளை அகற்றவும்","Follow approved whorl treatment":"அங்கீகரிக்கப்பட்ட குருத்து சிகிச்சையைப் பின்பற்றவும்","Red rot":"செவ்வழுகல் நோய்","Upper leaves yellow and dry":"மேல் இலைகள் மஞ்சளாகிக் காயும்","Split cane is red inside with white cross bands and a sour smell":"பிளந்த கரும்பின் உள்ளே சிவப்பு நிறம், வெள்ளைக் குறுக்குப் பட்டைகள், புளித்த வாடை","A fungus spread mainly through infected setts.":"முக்கியமாகப் பாதித்த விதைக் கரணைகள் மூலம் பரவும் பூஞ்சை.","Plant healthy setts of resistant varieties":"எதிர்ப்பு இரகங்களின் ஆரோக்கியமான கரணைகளை நடவும்","Rotate with rice":"நெல்லுடன் பயிர் சுழற்சி செய்யவும்","Do not ratoon an affected crop":"பாதித்த பயிரில் மறுதாம்பு விடாதீர்கள்","Uproot and burn affected clumps":"பாதித்த தூர்களைப் பிடுங்கி எரிக்கவும்","Inform your sugar mill or agriculture officer":"சர்க்கரை ஆலை அல்லது வேளாண் அலுவலரிடம் தெரிவிக்கவும்","Early shoot borer":"இளங்குருத்துப் புழு","Dead heart in young shoots that pulls out easily and smells bad":"இளங்குருத்து காய்ந்து, எளிதில் உருவி வரும்; துர்நாற்றம் வீசும்","A moth caterpillar.":"அந்துப்பூச்சியின் புழு.","Apply trash mulch":"சோகை மூடாக்கு இடவும்","Irrigate on time":"சரியான நேரத்தில் பாசனம் செய்யவும்","Earth up":"மண் அணைக்கவும்","Use approved biological control on advice":"ஆலோசனைப்படி அங்கீகரிக்கப்பட்ட உயிரியல் கட்டுப்பாட்டைப் பயன்படுத்தவும்",Smut:"கரிப்பூட்டை நோய்","A long black whip-like growth from the top of the cane":"கரும்பின் நுனியிலிருந்து நீண்ட கருப்புச் சாட்டை போன்ற வளர்ச்சி","Thin, weak shoots":"மெலிந்த, பலவீனமான தூர்கள்","A fungus spread by spores and infected setts.":"வித்துகள் மற்றும் பாதித்த கரணைகள் மூலம் பரவும் பூஞ்சை.","Use disease-free setts":"நோயற்ற கரணைகளைப் பயன்படுத்தவும்","Grow resistant varieties":"எதிர்ப்பு இரகங்களைப் பயிரிடவும்","Bag and remove whips carefully, then destroy the clump":"சாட்டைகளைக் கவனமாகப் பையிட்டு அகற்றி, பின் தூரை அழிக்கவும்","Use alternate wetting and drying instead of continuous deep flooding":"தொடர்ந்து ஆழமாக நீர் தேக்காமல், நீர் மறைய மறையப் பாசனம் செய்யவும்","Level the field and plug bund leaks":"வயலைச் சமன் செய்து வரப்புக் கசிவுகளை அடைக்கவும்","Keep standing water at 5 cm or less":"தேங்கும் நீர் 5 செ.மீ அல்லது அதற்குக் குறைவாக இருக்கட்டும்","Transplanting to day 7":"நடவு முதல் 7 ஆம் நாள் வரை","Keep about 2 cm of water for seven days.":"ஏழு நாட்களுக்கு சுமார் 2 செ.மீ நீர் வைக்கவும்.","Establishment and tillering":"வேர் பிடித்தல் மற்றும் தூர் கட்டுதல்","Flood to about 5 cm, then irrigate again after the ponded water disappears.":"சுமார் 5 செ.மீ நீர் கட்டி, தேங்கிய நீர் மறைந்த பின் மீண்டும் பாசனம் செய்யவும்.","Loamy soil: 1 day after it disappears in summer, 3 days in winter.":"பசளை மண்: கோடையில் நீர் மறைந்த 1 நாள் கழித்து, குளிர்காலத்தில் 3 நாள் கழித்து.","Clay soil: just before or as it disappears in summer, 1–2 days after in winter.":"களிமண்: கோடையில் நீர் மறையும் சமயம் அல்லது சற்று முன்; குளிர்காலத்தில் 1–2 நாள் கழித்து.","Panicle initiation to flowering (critical)":"கதிர் உருவாதல் முதல் பூத்தல் வரை (முக்கியம்)","Keep the soil saturated. Do not let the field dry.":"மண்ணை நீர் நிறைந்த நிலையில் வைக்கவும். வயல் காய விடாதீர்கள்.","Grain filling to maturity":"பால் பிடித்தல் முதல் முதிர்ச்சி வரை","Avoid standing water of 5 cm or more. Irrigate one day after water disappears, and give the last irrigation 15 days before harvest.":"5 செ.மீ அல்லது அதற்கு மேல் நீர் தேங்குவதைத் தவிர்க்கவும். நீர் மறைந்த ஒரு நாள் கழித்துப் பாசனம் செய்து, அறுவடைக்கு 15 நாள் முன் கடைசிப் பாசனம் செய்யவும்.","Sprinklers can save about 30% of water":"தெளிப்பு நீர்ப் பாசனம் சுமார் 30% நீரைச் சேமிக்கும்","Add composted coir pith to heavy soils":"கனமான மண்ணில் மக்கிய தென்னை நார்க்கழிவு சேர்க்கவும்","Under water stress, 0.5% potassium chloride spray at flowering and pod stage helps":"நீர்ப் பற்றாக்குறையின்போது, பூக்கும் மற்றும் காய் பருவத்தில் 0.5% பொட்டாசியம் குளோரைடு தெளிப்பது உதவும்","Sowing and establishment":"விதைப்பு மற்றும் முளைப்பு","Irrigate at sowing and give a life irrigation 4–5 days later.":"விதைத்தவுடன் பாசனம் செய்து, 4–5 நாள் கழித்து உயிர்த்தண்ணீர் விடவும்.","Before flowering (to day 25)":"பூப்பதற்கு முன் (25 ஆம் நாள் வரை)","Give one irrigation at about 20 days.":"சுமார் 20 ஆம் நாளில் ஒரு பாசனம் செய்யவும்.","Flowering (critical)":"பூக்கும் பருவம் (முக்கியம்)","Give two irrigations.":"இரண்டு பாசனம் செய்யவும்.","Pegging (critical)":"விழுது இறங்கும் பருவம் (முக்கியம்)","Give one or two irrigations.":"ஒன்று அல்லது இரண்டு பாசனம் செய்யவும்.","Pod development (critical)":"காய் வளர்ச்சிப் பருவம் (முக்கியம்)","Give two or three irrigations depending on the soil.":"மண்ணைப் பொறுத்து இரண்டு அல்லது மூன்று பாசனம் செய்யவும்.",Maturity:"முதிர்ச்சிப் பருவம்","Irrigate sparingly, only if the crop is drying before the pods fill.":"காய் நிரம்பும் முன் பயிர் காய்ந்தால் மட்டும் சிக்கனமாகப் பாசனம் செய்யவும்.","Drip suits hybrids well":"வீரிய ஒட்டு இரகங்களுக்குச் சொட்டு நீர் ஏற்றது","Irrigate alternate furrows":"ஒன்றுவிட்ட சால்களில் பாசனம் செய்யவும்","Mulch between rows":"வரிசைகளுக்கு இடையே மூடாக்கு இடவும்","Planting and establishment":"நடவு மற்றும் வேர் பிடித்தல்","Irrigate at transplanting and again about 3 days later.":"நடவின்போதும், சுமார் 3 நாள் கழித்தும் பாசனம் செய்யவும்.","Vegetative growth":"பயிர் வளர்ச்சிப் பருவம்","Irrigate about once a week.":"சுமார் வாரம் ஒருமுறை பாசனம் செய்யவும்.","Light soil: every 5–6 days.":"இலேசான மண்: 5–6 நாட்களுக்கு ஒருமுறை.","Heavy soil: every 7–10 days.":"கனமான மண்: 7–10 நாட்களுக்கு ஒருமுறை.","Flowering and fruit set (critical)":"பூத்தல் மற்றும் காய் பிடித்தல் (முக்கியம்)","Keep moisture even. Do not let the soil dry out.":"ஈரப்பதத்தைச் சீராக வைக்கவும். மண் காய விடாதீர்கள்.","Light soil: every 4–5 days.":"இலேசான மண்: 4–5 நாட்களுக்கு ஒருமுறை.","Heavy soil: every 6–7 days.":"கனமான மண்: 6–7 நாட்களுக்கு ஒருமுறை.","Fruit ripening and picking":"பழுத்தல் மற்றும் பறிப்பு","Irrigate lightly and regularly to reduce cracking.":"வெடிப்பைக் குறைக்க இலேசாகவும் சீராகவும் பாசனம் செய்யவும்.","Use skip-furrow or alternate-furrow irrigation":"ஒரு சால் விட்டு அல்லது ஒன்றுவிட்ட சால் பாசனம் செய்யவும்","Mulch with sugarcane trash":"கரும்புச் சோகையால் மூடாக்கு இடவும்","Excess water causes leafy growth and fewer bolls":"அதிக நீர் இலை வளர்ச்சியை அதிகரித்து, காய்களைக் குறைக்கும்","Sowing and germination":"விதைப்பு மற்றும் முளைத்தல்","Irrigate after sowing and give a life irrigation on day 5.":"விதைத்த பின் பாசனம் செய்து, 5 ஆம் நாளில் உயிர்த்தண்ணீர் விடவும்.","Vegetative (days 16–44)":"வளர்ச்சிப் பருவம் (16–44 நாட்கள்)","Irrigate at about day 20.":"சுமார் 20 ஆம் நாளில் பாசனம் செய்யவும்.","Light soil: again around day 35.":"இலேசான மண்: மீண்டும் சுமார் 35 ஆம் நாளில்.","Heavy soil: again around day 40.":"கனமான மண்: மீண்டும் சுமார் 40 ஆம் நாளில்.","Flowering and boll formation (critical)":"பூத்தல் மற்றும் காய் உருவாதல் (முக்கியம்)","Irrigate well at about days 48–55, 60–70, 72–85 and 84–100.":"சுமார் 48–55, 60–70, 72–85 மற்றும் 84–100 ஆம் நாட்களில் நன்கு பாசனம் செய்யவும்.","Boll maturity":"காய் முதிர்ச்சி","Irrigate from about day 108 as needed.":"சுமார் 108 ஆம் நாள் முதல் தேவைக்கேற்பப் பாசனம் செய்யவும்.","Light soil: last irrigation near day 144.":"இலேசான மண்: கடைசிப் பாசனம் சுமார் 144 ஆம் நாளில்.","Heavy soil: give fewer irrigations; stop by day 150.":"கனமான மண்: குறைவான பாசனம்; 150 ஆம் நாளுக்குள் நிறுத்தவும்.","Do not stress the crop at tasseling and silking":"பூங்கதிர் மற்றும் நூலிழைப் பருவத்தில் பயிருக்கு நீர் அழுத்தம் ஏற்பட விடாதீர்கள்","Irrigate along furrows instead of flooding":"வயல் முழுவதும் நீர் கட்டாமல் சால் வழியாகப் பாசனம் செய்யவும்","Drain excess water quickly":"அதிக நீரை விரைவில் வடிக்கவும்","Germination and establishment":"முளைத்தல் மற்றும் நிலைபெறுதல்","Irrigate at sowing, day 4 and day 12.":"விதைப்பின்போது, 4 ஆம் மற்றும் 12 ஆம் நாளில் பாசனம் செய்யவும்.",Vegetative:"வளர்ச்சிப் பருவம்","Light soil: days 22, 32 and 40.":"இலேசான மண்: 22, 32 மற்றும் 40 ஆம் நாட்கள்.","Heavy soil: days 25 and 36.":"கனமான மண்: 25 மற்றும் 36 ஆம் நாட்கள்.","Tasseling and silking (critical)":"பூங்கதிர் மற்றும் நூலிழைப் பருவம் (முக்கியம்)","Irrigate generously.":"தாராளமாகப் பாசனம் செய்யவும்.","Light soil: days 50, 60 and 72.":"இலேசான மண்: 50, 60 மற்றும் 72 ஆம் நாட்கள்.","Heavy soil: days 48 and 60.":"கனமான மண்: 48 மற்றும் 60 ஆம் நாட்கள்.","Irrigate in limited amounts.":"அளவோடு பாசனம் செய்யவும்.","Light soil: days 85 and 95.":"இலேசான மண்: 85 மற்றும் 95 ஆம் நாட்கள்.","Heavy soil: days 72 and 85.":"கனமான மண்: 72 மற்றும் 85 ஆம் நாட்கள்.","Use alternate or skip-furrow irrigation":"ஒன்றுவிட்ட அல்லது ஒரு சால் விட்டுப் பாசனம் செய்யவும்","Spread cane trash as mulch":"கரும்புச் சோகையை மூடாக்காகப் பரப்பவும்","Drip with fertigation saves much water":"சொட்டு நீர் உரப்பாசனம் அதிக நீரைச் சேமிக்கும்","Germination (days 0–35)":"முளைப்புப் பருவம் (0–35 நாட்கள்)","Wet the soil shallowly (2–3 cm) at short intervals, more often on sandy soil.":"குறுகிய இடைவெளியில் மேலோட்டமாக (2–3 செ.மீ) நனைக்கவும்; மணல் மண்ணில் அடிக்கடி.","Tillering (days 36–100, critical)":"தூர் கட்டும் பருவம் (36–100 நாட்கள், முக்கியம்)","Light soil: every 8 days.":"இலேசான மண்: 8 நாட்களுக்கு ஒருமுறை.","Heavy soil: every 10 days.":"கனமான மண்: 10 நாட்களுக்கு ஒருமுறை.","Grand growth (days 101–270)":"அதிவேக வளர்ச்சிப் பருவம் (101–270 நாட்கள்)","Maturity (day 271 to harvest)":"முதிர்ச்சிப் பருவம் (271 ஆம் நாள் முதல் அறுவடை வரை)","Light soil: every 10 days.":"இலேசான மண்: 10 நாட்களுக்கு ஒருமுறை.","Heavy soil: every 14 days.":"கனமான மண்: 14 நாட்களுக்கு ஒருமுறை.","Drip irrigation uses far less water than flooding":"பரப்புப் பாசனத்தைவிடச் சொட்டு நீர்ப் பாசனத்திற்கு மிகக் குறைந்த நீர் போதும்","Form basins around plants linked by channels":"வாய்க்கால்களால் இணைத்த வட்டப் பாத்திகளை மரங்களைச் சுற்றி அமைக்கவும்","Mulch with dried leaves":"காய்ந்த இலைகளால் மூடாக்கு இடவும்","Planting to 4th month":"நடவு முதல் 4 ஆம் மாதம் வரை","Surface: irrigate after planting, after 4 days, then weekly on garden land.":"பரப்புப் பாசனம்: நட்டவுடன், 4 நாள் கழித்து, பின் தோட்டக்காலில் வாரந்தோறும்.","5–10 litres per plant per day":"ஒரு மரத்திற்கு ஒரு நாளைக்கு 5–10 லிட்டர்","5th month to shooting":"5 ஆம் மாதம் முதல் குலை தள்ளும் வரை","Surface: weekly on garden land, every 10–15 days on wetland.":"பரப்புப் பாசனம்: தோட்டக்காலில் வாரந்தோறும், நஞ்சையில் 10–15 நாட்களுக்கு ஒருமுறை.","10–15 litres per plant per day":"ஒரு மரத்திற்கு ஒரு நாளைக்கு 10–15 லிட்டர்","Shooting to harvest":"குலை தள்ளுதல் முதல் அறுவடை வரை","Surface: keep weekly irrigation. Stop 15 days before harvest.":"பரப்புப் பாசனம்: வாரந்தோறும் தொடரவும். அறுவடைக்கு 15 நாள் முன் நிறுத்தவும்.","15 litres per plant per day until 15 days before harvest":"அறுவடைக்கு 15 நாள் முன்பு வரை ஒரு மரத்திற்கு ஒரு நாளைக்கு 15 லிட்டர்","Apply green manure or farmyard manure as well. A leaf colour chart helps time the nitrogen.":"பசுந்தாள் உரம் அல்லது தொழு உரமும் இடவும். இலை வண்ண அட்டை தழைச்சத்து இடும் நேரத்தை அறிய உதவும்.","Medium or long duration":"நடுத்தர அல்லது நீண்ட கால இரகம்","Basal (at planting)":"அடியுரம் (நடவின்போது)","Active tillering":"தீவிரத் தூர் கட்டும் பருவம்","Panicle initiation":"கதிர் உருவாகும் பருவம்",Heading:"கதிர் வெளிவரும் பருவம்","Short duration, Cauvery delta or Coimbatore":"குறுகிய கால இரகம், காவிரி டெல்டா அல்லது கோயம்புத்தூர்","Short duration, other areas":"குறுகிய கால இரகம், பிற பகுதிகள்","Hybrid rice":"வீரிய ஒட்டு நெல்","Improved White Ponni and similar":"மேம்படுத்தப்பட்ட வெள்ளைப் பொன்னி போன்றவை","Basal (P and part K)":"அடியுரம் (மணிச்சத்து மற்றும் சாம்பல் சத்தின் ஒரு பகுதி)","Also apply gypsum on day 45 and incorporate it while earthing up.":"45 ஆம் நாளில் ஜிப்சமும் இட்டு, மண் அணைக்கும்போது கலக்கவும்.",Irrigated:"இறவை","Basal (at sowing)":"அடியுரம் (விதைப்பின்போது)","20 days after sowing":"விதைத்த 20 ஆம் நாள்","45 days after sowing":"விதைத்த 45 ஆம் நாள்","TNAU also advises borax 10 kg and zinc sulphate 50 kg per hectare at planting.":"நடவின்போது எக்டருக்கு 10 கிலோ போராக்ஸ், 50 கிலோ துத்தநாக சல்பேட் இடவும் TNAU பரிந்துரைக்கிறது.",Variety:"இரகம்","30 days after planting":"நட்ட 30 ஆம் நாள்",Hybrid:"வீரிய ஒட்டு இரகம்","45 days after planting":"நட்ட 45 ஆம் நாள்","60 days after planting":"நட்ட 60 ஆம் நாள்","If the basal dose is missed, apply it by day 25.":"அடியுரம் தவறினால், 25 ஆம் நாளுக்குள் இடவும்.","Irrigated variety":"இறவை இரகம்","40–45 days after sowing":"விதைத்த 40–45 ஆம் நாள்","Irrigated hybrid":"இறவை வீரிய ஒட்டு இரகம்","65 days after sowing":"விதைத்த 65 ஆம் நாள்","Place top-dressed fertilizer along the furrow and cover it with soil.":"மேலுரத்தைச் சால் ஓரமாக இட்டு மண்ணால் மூடவும்.","Basal (before sowing)":"அடியுரம் (விதைப்புக்கு முன்)","25 days after sowing":"விதைத்த 25 ஆம் நாள்","The 30, 60 and 90 day timing is for areas with assured water.":"30, 60, 90 ஆம் நாள் அட்டவணை உறுதியான நீர் வசதி உள்ள பகுதிகளுக்கு.","Plant crop for sugar mill":"30 ஆம் நாள்","30 days":"60 ஆம் நாள்","60 days":"90 ஆம் நாள்","90 days":"ஆலைக்கான நடவுக் கரும்பு","Ratoon crop for sugar mill":"ஆலைக்கான மறுதாம்புக் கரும்பு","Basal (at ratooning)":"அடியுரம் (மறுதாம்பின்போது)","Cane for jaggery":"வெல்லத்திற்கான கரும்பு","Tissue-culture banana needs 50% extra fertilizer, given at months 2, 4, 6 and 8. Ask your officer for the split amounts.":"திசு வளர்ப்பு வாழைக்கு 50% கூடுதல் உரம் தேவை; 2, 4, 6, 8 ஆம் மாதங்களில் இடவும். பிரித்து இடும் அளவை அலுவலரிடம் கேட்கவும்.","Garden land, varieties other than Nendran":"தோட்டக்கால், நேந்திரன் அல்லாத இரகங்கள்","Garden land, Nendran":"தோட்டக்கால், நேந்திரன்","3rd month":"3 ஆம் மாதம்","5th month":"5 ஆம் மாதம்","7th month":"7 ஆம் மாதம்","Use 30 t of farmyard manure per hectare for hybrids.":"வீரிய ஒட்டு இரகங்களுக்கு எக்டருக்கு 30 டன் தொழு உரம் இடவும்.","90 days after planting":"நட்ட 90 ஆம் நாள்","Seed Selection":"விதைத் தேர்வு","Buy certified seed from a government depot or licensed dealer, and keep the bill and label.":"அரசுக் கிடங்கு அல்லது உரிமம் பெற்ற விற்பனையாளரிடம் சான்று பெற்ற விதை வாங்கி, இரசீதையும் அட்டையையும் வைத்திருக்கவும்.","Choose a variety suited to your district, season and water supply.":"மாவட்டம், பருவம், நீர் வசதிக்கு ஏற்ற இரகத்தைத் தேர்ந்தெடுக்கவும்.","Test germination: place 100 seeds in a wet cloth and count the sprouts after a few days.":"முளைப்புச் சோதனை: 100 விதைகளை ஈரத் துணியில் வைத்து, சில நாட்கள் கழித்து முளைத்தவற்றை எண்ணவும்.","Treat seed before sowing with a recommended bio-agent or fungicide.":"விதைப்புக்கு முன் பரிந்துரைத்த உயிரியல் காரணி அல்லது பூஞ்சைக்கொல்லியால் விதை நேர்த்தி செய்யவும்.","Land Preparation":"நிலம் தயாரித்தல்","Test your soil before the season.":"பருவத்திற்கு முன் மண் பரிசோதனை செய்யவும்.","Plough according to the crop; summer ploughing exposes pests to sun and birds.":"பயிருக்கேற்ப உழவும்; கோடை உழவு பூச்சிகளை வெயிலுக்கும் பறவைகளுக்கும் வெளிப்படுத்தும்.","Level the field so water spreads evenly.":"நீர் சீராகப் பரவ வயலைச் சமன் செய்யவும்.","Keep drainage channels open.":"வடிகால் வாய்க்கால்களைத் திறந்து வைக்கவும்.","Mix well-rotted manure into the soil before sowing.":"விதைப்புக்கு முன் நன்கு மக்கிய எருவை மண்ணில் கலக்கவும்.","Sowing Methods":"விதைப்பு முறைகள்","Sow in the recommended season and avoid very late sowing.":"பரிந்துரைத்த பருவத்தில் விதைக்கவும்; மிகத் தாமதமான விதைப்பைத் தவிர்க்கவும்.","Sow in lines so weeding and spraying are easier.":"களையெடுப்பும் தெளிப்பும் எளிதாக வரிசையில் விதைக்கவும்.","Keep the recommended spacing and seed rate.":"பரிந்துரைத்த இடைவெளி மற்றும் விதை அளவைப் பின்பற்றவும்.","Fill gaps within about 10 days.":"சுமார் 10 நாட்களுக்குள் இடைவெளிகளை நிரப்பவும்.","Weed Management":"களை மேலாண்மை","Keep the field weed-free in the first 30–45 days.":"முதல் 30–45 நாட்கள் வயலைக் களையின்றி வைக்கவும்.","Remove weeds before they set seed.":"களைகள் விதை பிடிக்கும் முன் அகற்றவும்.","Use mulch or a hand or power weeder.":"மூடாக்கு அல்லது கை/விசைக் களையெடுப்புக் கருவி பயன்படுத்தவும்.","Use herbicides only at the approved dose and time.":"களைக்கொல்லிகளை அங்கீகரிக்கப்பட்ட அளவிலும் நேரத்திலும் மட்டும் பயன்படுத்தவும்.","Water Management":"நீர் மேலாண்மை","Irrigate at critical stages such as flowering and grain filling.":"பூத்தல், மணி பிடித்தல் போன்ற முக்கியப் பருவங்களில் பாசனம் செய்யவும்.","Check soil moisture by hand before irrigating.":"பாசனத்திற்கு முன் கையால் மண் ஈரத்தைப் பார்க்கவும்.","Use drip or sprinkler where it suits the crop.":"பயிருக்கு ஏற்ற இடங்களில் சொட்டு அல்லது தெளிப்பு நீர்ப் பாசனம் பயன்படுத்தவும்.","Check the rain forecast first.":"முதலில் மழை முன்னறிவிப்பைப் பார்க்கவும்.","Harvest rainwater in farm ponds.":"பண்ணைக் குட்டைகளில் மழைநீரைச் சேமிக்கவும்.","Soil Management":"மண் மேலாண்மை","Get a Soil Health Card test and follow it.":"மண்வள அட்டைப் பரிசோதனை செய்து அதன்படி நடக்கவும்.","Add farmyard manure, compost or vermicompost every season.":"ஒவ்வொரு பருவமும் தொழு உரம், மட்கு உரம் அல்லது மண்புழு உரம் சேர்க்கவும்.","Grow green manures such as daincha or sunnhemp and plough them in.":"தக்கைப்பூண்டு, சணப்பு போன்ற பசுந்தாள் உரப் பயிர்களை வளர்த்து மடக்கி உழவும்.","Rotate cereals with pulses.":"தானியங்களுடன் பயறு வகைகளைச் சுழற்சி செய்யவும்.","Do not burn crop residue.":"பயிர்க் கழிவுகளை எரிக்காதீர்கள்.","Pest Control":"பூச்சிக் கட்டுப்பாடு","Walk the field every week and look under leaves.":"வாரந்தோறும் வயலைச் சுற்றி வந்து இலைகளின் அடியைப் பார்க்கவும்.","Use traps and protect helpful insects.":"பொறிகளைப் பயன்படுத்தி, நன்மை செய்யும் பூச்சிகளைக் காக்கவும்.","Spray only when needed, using approved products at label dose.":"தேவைப்படும்போது மட்டும், அங்கீகரிக்கப்பட்ட மருந்தை அட்டையில் உள்ள அளவில் தெளிக்கவும்.","Wear gloves, mask and covering clothes while spraying.":"தெளிக்கும்போது கையுறை, முகக்கவசம், உடலை மூடும் ஆடை அணியவும்.","Do not spray in wind or before rain, and observe the waiting period before harvest.":"காற்று வீசும்போது அல்லது மழைக்கு முன் தெளிக்காதீர்கள்; அறுவடைக்கு முன் காத்திருப்புக் காலத்தைக் கடைப்பிடிக்கவும்.","Harvesting Techniques":"அறுவடை நுட்பங்கள்","Harvest at the right maturity.":"சரியான முதிர்ச்சியில் அறுவடை செய்யவும்.","Choose dry weather.":"வறண்ட வானிலையைத் தேர்ந்தெடுக்கவும்.","Use clean tools and avoid bruising produce.":"சுத்தமான கருவிகளைப் பயன்படுத்தி, விளைபொருள் காயமடையாமல் பார்க்கவும்.","Keep harvested produce off bare soil.":"அறுவடை செய்த பொருளை வெறும் தரையில் வைக்காதீர்கள்.","Storage Methods":"சேமிப்பு முறைகள்","Dry grain well before storing.":"சேமிக்கும் முன் தானியத்தை நன்கு உலர்த்தவும்.","Clean the store and bags before use.":"பயன்படுத்தும் முன் கிடங்கையும் சாக்குகளையும் சுத்தம் செய்யவும்.","Stack bags on raised planks, away from walls.":"சுவரிலிருந்து விலக்கி, உயர்த்திய பலகைகளில் மூட்டைகளை அடுக்கவும்.","Keep out moisture and rats, and inspect monthly.":"ஈரமும் எலியும் வராமல் தடுத்து, மாதந்தோறும் பார்வையிடவும்.","Never mix pesticides with food grain in storage.":"சேமிப்பில் உணவு தானியத்துடன் பூச்சிமருந்தை ஒருபோதும் கலந்து வைக்காதீர்கள்.","Sustainable Agriculture":"நிலைத்த வேளாண்மை","Combine crops with livestock, fish or trees where it suits your farm.":"உங்கள் பண்ணைக்கு ஏற்ற இடங்களில் பயிருடன் கால்நடை, மீன் அல்லது மரங்களை இணைக்கவும்.","Save water with micro-irrigation and mulch.":"நுண்ணீர்ப் பாசனம் மற்றும் மூடாக்கு மூலம் நீரைச் சேமிக்கவும்.","Use biofertilizers and compost along with measured chemical fertilizer.":"அளவான இரசாயன உரத்துடன் உயிர் உரங்களையும் மட்கு உரத்தையும் பயன்படுத்தவும்.","Keep records of costs, inputs and yields.":"செலவு, இடுபொருள், விளைச்சல் கணக்குகளைப் பதிவு செய்யவும்.","Ask about government schemes and crop insurance before sowing.":"விதைப்புக்கு முன் அரசுத் திட்டங்கள் மற்றும் பயிர்க் காப்பீடு பற்றிக் கேட்டறியவும்.","Moderately resistant to blast and brown spot":"குலை நோய் மற்றும் பழுப்புப் புள்ளி நோய்க்கு மிதமான எதிர்ப்பு","Moderately resistant to brown planthopper (BPH) and white-backed planthopper":"புகையான் (BPH) மற்றும் வெண்முதுகுத் தத்துப்பூச்சிக்கு மிதமான எதிர்ப்பு","Tolerant to early-stage submergence for 10–14 days":"ஆரம்பப் பருவத்தில் 10–14 நாட்கள் நீரில் மூழ்கினாலும் தாங்கும்","Samba (August sowing)":"சம்பா (ஆகஸ்ட் விதைப்பு)","Short bold grain, good for idli":"குட்டையான பருமன் அரிசி, இட்லிக்கு ஏற்றது","Resistant to blast, brown spot, sheath rot and sheath blight":"குலை, பழுப்புப் புள்ளி, இலை உறை அழுகல், இலை உறைக் கருகலுக்கு எதிர்ப்பு","Resistant to leaf folder, stem borer and BPH":"இலைச்சுருட்டுப் புழு, தண்டுத் துளைப்பான், புகையானுக்கு எதிர்ப்பு","Moderately tolerant to sodic soil":"களர் மண்ணை மிதமாகத் தாங்கும்","Sodic soils":"களர் நிலங்கள்","Samba, Late Samba, Thaladi":"சம்பா, பின் சம்பா, தாளடி","Suited to idli making":"இட்லி தயாரிக்க ஏற்றது","Moderately resistant to blast":"குலை நோய்க்கு மிதமான எதிர்ப்பு","Tolerant to water inundation":"நீர் தேங்குவதைத் தாங்கும்","Suitable for saline and alkaline soils":"உவர் மற்றும் களர் நிலங்களுக்கு ஏற்றது","Saline and alkaline soils":"உவர் மற்றும் களர் நிலங்கள்","Samba, Late Samba":"சம்பா, பின் சம்பா","Medium bold grain":"நடுத்தரப் பருமன் அரிசி","Kuruvai, Navarai":"குறுவை, நவரை","Long slender grain":"நீண்ட சன்ன அரிசி","Moderately resistant to leaf blast, neck blast and sheath rot":"இலைக் குலை, கழுத்துக் குலை, இலை உறை அழுகலுக்கு மிதமான எதிர்ப்பு","Moderately resistant to white-backed planthopper":"வெண்முதுகுத் தத்துப்பூச்சிக்கு மிதமான எதிர்ப்பு","Drought tolerant":"வறட்சியைத் தாங்கும்","For drought-prone districts such as Ramanathapuram, Sivaganga and Virudhunagar":"இராமநாதபுரம், சிவகங்கை, விருதுநகர் போன்ற வறட்சி பாதிக்கும் மாவட்டங்களுக்கு","Resistant to rice tungro disease; moderately resistant to blast and brown spot":"துங்ரோ நோய்க்கு எதிர்ப்பு; குலை மற்றும் பழுப்புப் புள்ளி நோய்க்கு மிதமான எதிர்ப்பு","Resistant to green leafhopper":"பச்சைத் தத்துப்பூச்சிக்கு எதிர்ப்பு","Late Samba, Thaladi":"பின் சம்பா, தாளடி","Aromatic long slender rice":"நறுமணமுள்ள நீண்ட சன்ன அரிசி","Moderately resistant to leaf blast, neck blast and grain discolouration":"இலைக் குலை, கழுத்துக் குலை, மணி நிறமாற்றத்திற்கு மிதமான எதிர்ப்பு","Moderately resistant to BPH and stem borer":"புகையான் மற்றும் தண்டுத் துளைப்பானுக்கு மிதமான எதிர்ப்பு","Samba, Thaladi":"சம்பா, தாளடி","Medium slender grain":"நடுத்தரச் சன்ன அரிசி","Resistant to tomato leaf curl virus, bacterial wilt and early blight":"தக்காளி இலைச் சுருள் நச்சுயிரி, பாக்டீரியா வாடல், முன்பருவ இலைக் கருகலுக்கு எதிர்ப்பு","Summer, Kharif, Rabi":"கோடை, காரீப், ரபி","Firm 80–100 g fruits from ICAR-IIHR":"ICAR-IIHR இன் 80–100 கிராம் கெட்டியான பழங்கள்","Resistant to boll rot; moderately resistant to Alternaria leaf spot and grey mildew":"காய் அழுகலுக்கு எதிர்ப்பு; ஆல்டர்னேரியா இலைப்புள்ளி மற்றும் சாம்பல் பூஞ்சைக்கு மிதமான எதிர்ப்பு","Moderately resistant to leafhopper":"தத்துப்பூச்சிக்கு மிதமான எதிர்ப்பு","Winter rainfed and rice fallow":"குளிர்கால மானாவாரி மற்றும் நெல் தரிசு","Long staple, suits high-density planting":"நீண்ட இழை, அடர் நடவுக்கு ஏற்றது","Moderately resistant to late leaf spot and rust":"பின்பருவ இலைப்புள்ளி மற்றும் துரு நோய்க்கு மிதமான எதிர்ப்பு","Resistant to leaf miner; moderately resistant to sucking pests":"இலைச் சுரங்கப் புழுவுக்கு எதிர்ப்பு; சாறு உறிஞ்சும் பூச்சிகளுக்கு மிதமான எதிர்ப்பு","Kharif, Rabi":"காரீப், ரபி","51–52% oil":"51–52% எண்ணெய்","Tolerant to drought":"வறட்சியைத் தாங்கும் தன்மை","Bunch pods, 49.5% oil":"கொத்துக் காய்கள், 49.5% எண்ணெய்","Resistant to powdery mildew and viruses":"சாம்பல் நோய் மற்றும் நச்சுயிரிகளுக்கு எதிர்ப்பு","ICAR-IIHR hybrid; the checklist names other states, not Tamil Nadu":"ICAR-IIHR வீரிய ஒட்டு இரகம்; பட்டியலில் பிற மாநிலங்கள் உள்ளன, தமிழ்நாடு இல்லை","ICAR-IIHR hybrid listed for Tamil Nadu":"தமிழ்நாட்டிற்குப் பட்டியலிடப்பட்ட ICAR-IIHR வீரிய ஒட்டு இரகம்","Resistant to chilli leaf curl virus":"மிளகாய் இலைச் சுருள் நச்சுயிரிக்கு எதிர்ப்பு","ICAR-IIHR hybrid for green and dry chilli":"பச்சை மற்றும் வற்றல் மிளகாய்க்கான ICAR-IIHR வீரிய ஒட்டு இரகம்","Resistant to Fusarium wilt (race 1 and TR4)":"ஃபியூசேரியம் வாடலுக்கு (இனம் 1 மற்றும் TR4) எதிர்ப்பு","Rich in pro-vitamin A":"முன்னோடி வைட்டமின் A நிறைந்தது","Moderately resistant to Turcicum leaf blight":"டர்சிகம் இலைக் கருகலுக்கு மிதமான எதிர்ப்பு","Moderately resistant to fall armyworm and stem borer":"படைப்புழு மற்றும் தண்டுத் துளைப்பானுக்கு மிதமான எதிர்ப்பு","Stays green":"முதிர்விலும் பசுமையாக இருக்கும்","Moderately resistant to fruit and shoot borer":"காய் மற்றும் குருத்துத் துளைப்பானுக்கு மிதமான எதிர்ப்பு","Long light-purple fruits; western zone of Tamil Nadu":"நீண்ட வெளிர் ஊதாக் காய்கள்; தமிழ்நாட்டின் மேற்கு மண்டலம்",Crop:"பயிர்",Resistance:"எதிர்ப்புத் திறன்",mm:"மி.மீ",Back:"பின்செல்",Navigation:"வழிசெலுத்தல்","My details":"என் விவரங்கள்","Powered by":"வழங்குவோர்:",Home:"முகப்பு",Crops:"பயிர்கள்",Weather:"வானிலை","Pest Help":"பூச்சி உதவி",Sources:"ஆதாரங்கள்","p. {n}":"பக். {n}",Source:"ஆதாரம்","Kisan Call Centre":"உழவர் அழைப்பு மையம்","Free farm advice, 6 AM to 10 PM, every day.":"தினமும் காலை 6 முதல் இரவு 10 வரை இலவச வேளாண் ஆலோசனை.",Call:"அழைக்க","Live weather could not load. Check your internet connection and try again.":"நேரடி வானிலையைப் பெற முடியவில்லை. இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.","No place found with that name. Try a nearby town or choose your district.":"அந்தப் பெயரில் இடம் கிடைக்கவில்லை. அருகிலுள்ள ஊரை முயலவும் அல்லது மாவட்டத்தைத் தேர்ந்தெடுக்கவும்.","Place search could not load. Check your internet connection, or choose your district.":"இடத் தேடல் இயங்கவில்லை. இணைய இணைப்பைச் சரிபார்க்கவும் அல்லது மாவட்டத்தைத் தேர்ந்தெடுக்கவும்.","This device cannot share its location. Choose a district instead.":"இந்தச் சாதனத்தால் இருப்பிடத்தைப் பகிர முடியாது. மாவட்டத்தைத் தேர்ந்தெடுக்கவும்.","My location":"என் இருப்பிடம்","Location was not shared. Choose a district or search for your village.":"இருப்பிடம் பகிரப்படவில்லை. மாவட்டத்தைத் தேர்ந்தெடுக்கவும் அல்லது ஊரைத் தேடவும்.","⛈️ Heavy rainfall warning: {mm} mm expected ({day}). Clear drainage channels and avoid spraying and irrigation.":"⛈️ கனமழை எச்சரிக்கை: {mm} மி.மீ மழை எதிர்பார்ப்பு ({day}). வடிகால்களைச் சீர் செய்யவும்; தெளிப்பு, பாசனத்தைத் தவிர்க்கவும்.","🌧️ Rain expected today or tomorrow. Avoid pesticide spraying and unnecessary irrigation.":"🌧️ இன்று அல்லது நாளை மழை எதிர்பார்ப்பு. பூச்சிமருந்து தெளிப்பதையும் தேவையற்ற பாசனத்தையும் தவிர்க்கவும்.","🔥 Heatwave alert: up to {c}°C ({day}). Irrigate in the morning or evening and protect young plants and animals.":"🔥 வெப்ப அலை எச்சரிக்கை: {c}°C வரை ({day}). காலை அல்லது மாலையில் பாசனம் செய்து, இளம் பயிர்களையும் கால்நடைகளையும் காக்கவும்.","🌡️ High temperature in the next 3 days. Monitor soil moisture.":"🌡️ அடுத்த 3 நாட்களில் அதிக வெப்பம். மண் ஈரத்தைக் கவனிக்கவும்.","💨 Strong winds expected ({day}). Support tall crops such as banana and sugarcane. Do not spray.":"💨 பலத்த காற்று எதிர்பார்ப்பு ({day}). வாழை, கரும்பு போன்ற உயரமான பயிர்களுக்கு முட்டுக் கொடுக்கவும். மருந்து தெளிக்காதீர்கள்.","💨 Breezy today or tomorrow. Spray only when the air is calm.":"💨 இன்று அல்லது நாளை காற்று வீசும். காற்று அமைதியாக இருக்கும்போது மட்டும் தெளிக்கவும்.","✅ No rain, heat or wind warnings from this forecast. Check again tomorrow.":"✅ இந்த முன்னறிவிப்பில் மழை, வெப்பம், காற்று எச்சரிக்கை இல்லை. நாளை மீண்டும் பார்க்கவும்.","not usually sown in this season":"இந்தப் பருவத்தில் பொதுவாக விதைப்பதில்லை","soil is work g chart. The standard column is the dose before any soil-test change. The 25% increase or decrease is a simple general rule; your soil health card or officer may give a more exact dose.":"மண் தர மதிப்பீடு TNAU அட்டவணைப்படி. இரண்டாம் நெடுவரிசை மண் ஆய்வுத் திருத்தத்திற்கு முந்தைய அளவு. 25% கூட்டல் அல்லது குறைத்தல் ஒரு பொது விதி; மண்வள அட்டை அல்லது அலுவலர் துல்லியமான அளவைத் தரலாம்.","No soil test entered, so this is the standard (blanket) dose. A soil test gives a better answer.":"மண் ஆய்வு உள்ளிடப்படாததால் இது பொதுப் பரிந்துரை அளவு. மண் ஆய்வு மூலம் சிறந்த பதில் கிடைக்கும்.","Application timing":"உரமிடும் காலம்","Fertilizer in kg for your whole field. The highlighted row is the stage you chose.":"உங்கள் முழு வயலுக்கான உரம் (கிலோ). நிறம் காட்டிய வரிசை நீங்கள் தேர்ந்த பருவம்.",When:"எப்போது",Urea:"யூரியா",Total:"மொத்தம்","Urea 46% N, single super phosphate (SSP) 16% P₂O₅, muriate of potash (MOP) 60% K₂O.":"யூரியா 46% N, சூப்பர் பாஸ்பேட் (SSP) 16% P₂O₅, மியூரேட் ஆஃப் பொட்டாஷ் (MOP) 60% K₂O.","Gypsum on day 45: {n} kg":"45 ஆம் நாளில் ஜிப்சம்: {n} கிலோ","Method:":"இடும் முறை:","apply on moist soil, place it near the roots or along the furrow, cover it, and avoid applying just before heavy rain.":"ஈர மண்ணில், வேருக்கு அருகில் அல்லது சால் ஓரமாக இட்டு மூடவும்; கனமழைக்கு முன் இடுவதைத் தவிர்க்கவும்.","On sandy soil, giving nitrogen and potash in more, smaller splits reduces loss.":"மணல் மண்ணில் தழை, சாம்பல் சத்துகளைச் சிறு சிறு அளவாகப் பல முறை இட்டால் இழப்பு குறையும்.","Organic fertilizer options":"இயற்கை உர வாய்ப்புகள்","Farmyard manure":"தொழு உரம்","about {a} kg per plant, {b} t in all":"ஒரு மரத்திற்கு சுமார் {a} கிலோ, மொத்தம் {b} டன்","Farmyard manure or compost":"தொழு உரம் அல்லது மட்கு உரம்","about {a} t ({b} t per hectare) before the last ploughing":"கடைசி உழவுக்கு முன் சுமார் {a} டன் (எக்டருக்கு {b} டன்)",Vermicompost:"மண்புழு உரம்","a concentrated option; about 2.5 t per hectare can replace farmyard manure":"செறிவான உரம்; எக்டருக்கு சுமார் 2.5 டன் தொழு உரத்திற்கு மாற்றாகும்","Green manure":"பசுந்தாள் உரம்","grow daincha or sunnhemp and plough it in before the crop":"பயிருக்கு முன் தக்கைப்பூண்டு அல்லது சணப்பு வளர்த்து மடக்கி உழவும்",Biofertilizers:"உயிர் உரங்கள்","Azospirillum or Rhizobium (for pulses and groundnut) and phosphobacteria":"அசோஸ்பைரில்லம் அல்லது ரைசோபியம் (பயறு, நிலக்கடலைக்கு) மற்றும் பாஸ்போபாக்டீரியா","Signs of nutrient shortage":"சத்துக் குறைபாட்டு அறிகுறிகள்","older leaves turn pale yellow":"பழைய இலைகள் வெளிர் மஞ்சளாகும்","small dark or purplish leaves, weak roots":"சிறிய கரும்பச்சை அல்லது ஊதா நிற இலைகள், பலவீனமான வேர்","scorched edges on older leaves":"பழைய இலைகளின் ஓரம் தீய்தல்","small leaves, brown or pale bands":"சிறிய இலைகள், பழுப்பு அல்லது வெளிர் பட்டைகள்","young leaves yellow while veins stay green":"இளம் இலைகள் மஞ்சள், நரம்புகள் பச்சை","yellowing between veins on older leaves":"பழைய இலைகளில் நரம்புகளுக்கு இடையே மஞ்சள்","young leaves turn pale":"இளம் இலைகள் வெளிறும்","Improve soil health":"மண்வளம் மேம்படுத்த","Test soil regularly":"தொடர்ந்து மண் ஆய்வு செய்யவும்","Add organic matter every season":"ஒவ்வொரு பருவமும் அங்கக உரம் சேர்க்கவும்","Rotate with pulses":"பயறு வகைகளுடன் பயிர் சுழற்சி செய்யவும்","Do not burn residue":"பயிர்க் கழிவுகளை எரிக்காதீர்கள்","Avoid excess urea":"அதிக யூரியாவைத் தவிர்க்கவும்","Standard doses are Tamil Nadu recommendations. Outside Tamil Nadu, use your state university's dose.":"இவ்வளவுகள் தமிழ்நாட்டுப் பரிந்துரைகள். பிற மாநிலங்களில் அம்மாநிலப் பல்கலைக்கழக அளவைப் பின்பற்றவும்.","Smart Irrigation Guidance":"பாசன வழிகாட்டுதல்","Crop Growth Stage":"பயிர் வளர்ச்சிப் பருவம்","Choose a crop first":"முதலில் பயிரைத் தேர்ந்தெடுக்கவும்","Irrigation Method":"பாசன முறை","Get Irrigation Advice":"பாசன ஆலோசனை பெறுக","{n} lakh litres":"{n} இலட்சம் லிட்டர்","{n} litres":"{n} லிட்டர்","With drip: {x}.":"சொட்டு நீரில்: {x}.","With drip, give small amounts often, set by your drip system's flow rate and the weather.":"சொட்டு நீரில், அமைப்பின் நீர் வெளியேறும் அளவு மற்றும் வானிலைப்படி சிறிது சிறிதாக அடிக்கடி தரவும்.","With sprinklers, apply light irrigations and stop before water pools.":"தெளிப்பு நீரில் இலேசாகப் பாசனம் செய்து, நீர் தேங்கும் முன் நிறுத்தவும்.","A surface irrigation 5 cm deep on {a} acres is about {v}.":"{a} ஏக்கரில் 5 செ.மீ ஆழப் பரப்புப் பாசனத்திற்கு சுமார் {v}.","Irrigation advice: {crop}":"பாசன ஆலோசனை: {crop}","Critical stage.":"முக்கியப் பருவம்.","Water shortage now can reduce yield.":"இப்போது நீர்ப் பற்றாக்குறை விளைச்சலைக் குறைக்கும்.","For rain-based advice here, first open":"மழை அடிப்படையிலான ஆலோசனைக்கு முதலில் திறக்கவும்:","About {mm} mm of rain is forecast in 3 days. Postpone irrigation and check drainage.":"3 நாட்களில் சுமார் {mm} மி.மீ மழை எதிர்பார்ப்பு. பாசனத்தைத் தள்ளிப்போட்டு வடிகாலைச் சரிபார்க்கவும்.","About {mm} mm of rain is forecast in 3 days. Check the soil first; a lighter or later irrigation may be enough.":"3 நாட்களில் சுமார் {mm} மி.மீ மழை எதிர்பார்ப்பு. முதலில் மண்ணைப் பார்க்கவும்; இலேசான அல்லது தாமதமான பாசனம் போதுமானதாக இருக்கலாம்.","Only about {mm} mm of rain is forecast in 3 days. Do not count on rain.":"3 நாட்களில் சுமார் {mm} மி.மீ மழை மட்டுமே எதிர்பார்ப்பு. மழையை நம்ப வேண்டாம்.","About {mm} mm for the whole crop, or {v} on {a} acres (rain included).":"முழுப் பயிர்க் காலத்திற்கு சுமார் {mm} மி.மீ; {a} ஏக்கருக்கு {v} (மழை உட்பட).","How often at this stage":"இப்பருவத்தில் பாசன இடைவெளி","Your soil is in between. Check moisture and use a gap between these:":"உங்கள் மண் இடைப்பட்டது. ஈரத்தைப் பார்த்து இவற்றுக்கு இடைப்பட்ட இடைவெளி விடவும்:","Best time":"சிறந்த நேரம்","Early morning or evening.":"அதிகாலை அல்லது மாலை.","Common choices:":"பொதுவான முறைகள்:","Water-saving techniques":"நீர்ச் சேமிப்பு நுட்பங்கள்","Over-irrigation warning":"அதிகப் பாசன எச்சரிக்கை","During drought":"வறட்சிக் காலத்தில்","Schedule and seasonal water figures follow TNAU guidance. Adjust for your field and weather.":"அட்டவணையும் நீர் அளவும் TNAU வழிகாட்டுதல்படி. உங்கள் வயல், வானிலைக்கேற்ப மாற்றிக் கொள்ளவும்.","This schedule is general guidance. Confirm it with your agriculture officer.":"இந்த அட்டவணை பொது வழிகாட்டுதல். வேளாண் அலுவலரிடம் உறுதி செய்யவும்.","Light soil drains fast, so check it more often.":"இலேசான மண்ணில் நீர் விரைவில் வடியும்; அடிக்கடி பார்க்கவும்.","Heavy soil holds water, so check before each irrigation.":"கனமான மண் நீரைத் தக்கவைக்கும்; ஒவ்வொரு பாசனத்துக்கும் முன் பார்க்கவும்.","Suits this crop":"இப்பயிருக்கு ஏற்றது","Not the usual choice":"வழக்கமான முறை அல்ல","Standing water in the root zone deeper than needed wastes water and nutrients.":"தேவைக்கு மேல் ஆழமாக நீர் தேக்கினால் நீரும் சத்துகளும் வீணாகும்.","Standing water in the root zone can rot roots, spread disease and wash away fertilizer.":"வேர்ப் பகுதியில் தேங்கும் நீர் வேர் அழுகல், நோய்ப் பரவல், உர இழப்பை ஏற்படுத்தும்.","Save water for the critical stages":"முக்கியப் பருவங்களுக்கு நீரைச் சேமிக்கவும்","Mulch the soil and remove weeds":"மண்ணில் மூடாக்கு இட்டுக் களை அகற்றவும்","Irrigate alternate rows or furrows where possible":"முடிந்த இடங்களில் ஒன்றுவிட்ட வரிசை அல்லது சாலில் பாசனம் செய்யவும்","Smart Farming Tips":"விவசாயக் குறிப்புகள்","Choose a topic.":"ஒரு தலைப்பைத் தேர்ந்தெடுக்கவும்.","Step 1: Select crop":"படி 1: பயிரைத் தேர்ந்தெடு","Step 2: Select problem":"படி 2: பிரச்சினையைத் தேர்ந்தெடு","Step 3: Varieties found: {n}":"படி 3: கிடைத்த இரகங்கள்: {n}",Duration:"வயது","Special features":"சிறப்பியல்புகள்","Not stated in source":"ஆதாரத்தில் குறிப்பிடப்படவில்லை","This app has no checked variety of this crop for this problem.":"இப்பிரச்சினைக்கு இப்பயிரில் சரிபார்க்கப்பட்ட இரகம் இச்செயலியில் இல்லை.","It does have: {x}.":"இருப்பவை: {x}.","Resistance covers only the pest, disease or stress named. Check seed availability and local suitability with TNAU or your agriculture office.":"குறிப்பிட்ட பூச்சி, நோய் அல்லது அழுத்தத்திற்கு மட்டுமே எதிர்ப்பு. விதை இருப்பு, உள்ளூர்ப் பொருத்தத்தை TNAU அல்லது வேளாண் அலுவலகத்தில் கேட்டறியவும்.","Source Numbers":"ஆதார எண்கள்","The number in [ ] on a screen matches this list. Irrigation, fertilizer and variety pages cite t <!-- INSTALL BUTTON SCRIPT START -->
<script>
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

installBtn.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert("To install Pasumai Kural, open Chrome menu (⋮) and select Install app.");
  }
});

window.addEventListener("appinstalled", () => {
  installBtn.style.display = "none";
});
</script>
<!-- INSTALL BUTTON SCRIPT END -->
